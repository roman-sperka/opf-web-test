<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e38"><title>OPF | Test webových aplikácií</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 15%,#286c60,#123e38 65%);color:#f6f5ed;display:grid;place-items:center;padding:24px}.card{width:min(100%,620px);padding:clamp(24px,6vw,55px);border:1px solid #ffffff33;border-radius:24px;background:#092b2780;box-shadow:0 24px 65px #001a1640}.tag{color:#dba04a;letter-spacing:.18em;font-size:.8rem;font-weight:700}h1{font-size:clamp(2rem,6vw,3.7rem);line-height:1.12;margin:18px 0}p{color:#c7dcd6;line-height:1.6}button{background:#dba04a;color:#173b34;border:0;border-radius:12px;padding:15px 22px;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#f2ba65}#counter{font-size:4rem;font-weight:750;margin:20px 0;font-variant-numeric:tabular-nums}.status{margin-top:24px;font-size:.9rem;color:#c7dcd6}</style></head><body><main class="card"><div class="tag">OPF / TESTOVACIE PROSTREDIE</div><h1>Automatická aktualizácia funguje!</h1><p>Táto verzia bola aktualizovaná priamo z ChatGPT a automaticky sa publikuje cez GitHub a Netlify. Kliknutím otestuješ JavaScript.</p><div id="counter" aria-live="polite">0</div><button id="add" type="button">Pridať +1</button><button id="reset" type="button" style="margin-left:8px;background:transparent;color:#f6f5ed;border:1px solid #ffffff55">Reset</button><div class="status" id="status">Aplikácia je pripravená.</div></main><script>let count=0;const display=document.getElementById('counter');const status=document.getElementById('status');document.getElementById('add').addEventListener('click',()=>{display.textContent=++count;status.textContent='JavaScript funguje správne.'});document.getElementById('reset').addEventListener('click',()=>{count=0;display.textContent=0;status.textContent='Počítadlo bolo vynulované.'});</script></body></html>
